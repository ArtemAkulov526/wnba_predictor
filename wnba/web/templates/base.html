<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}WNBA Predictor{% endblock %}</title>
    <style>
        :root { --border: #d4d4d8; --muted: #6b7280; --bg: #ffffff; --fg: #18181b;
                --accent: #1d4ed8; --panel: #f7f7f8; --win: #15803d; --loss: #b91c1c; }
        @media (prefers-color-scheme: dark) {
            :root { --border: #3f3f46; --muted: #a1a1aa; --bg: #18181b; --fg: #f4f4f5;
                    --accent: #60a5fa; --panel: #232327; --win: #4ade80; --loss: #f87171; }
        }
        body { font-family: system-ui, -apple-system, Arial, sans-serif;
               background: var(--bg); color: var(--fg); margin: 0;
               padding: 24px 16px; line-height: 1.5; }
        .wrap { max-width: 980px; margin: 0 auto; }
        nav { display: flex; gap: 16px; margin-bottom: 8px; font-size: .9rem; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        h1, h2 { font-weight: 600; }
        form.panel { background: var(--panel); border: 1px solid var(--border);
                     border-radius: 8px; padding: 16px; display: grid; gap: 12px; }
        label { font-size: .875rem; color: var(--muted); display: block; margin-bottom: 4px; }
        label.inline { display: flex; align-items: center; gap: 8px; color: var(--fg); }
        select, input[type=text], button {
            font: inherit; padding: 8px; border-radius: 6px; border: 1px solid var(--border);
            background: var(--bg); color: var(--fg); width: 100%; box-sizing: border-box; }
        button { background: var(--accent); color: #fff; border: none; cursor: pointer;
                 font-weight: 600; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }
        .table-scroll { overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; margin-top: 12px; font-size: .9rem; }
        th, td { border: 1px solid var(--border); padding: 6px 8px; text-align: left;
                 white-space: nowrap; }
        th { background: var(--panel); }
        td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
        tr.clickable { cursor: pointer; }
        tr.clickable:hover td { background: var(--panel); }
        .win { color: var(--win); font-weight: 600; }
        .loss { color: var(--loss); font-weight: 600; }
        .result { border: 1px solid var(--border); border-radius: 8px; padding: 16px;
                  margin-top: 16px; }
        .bar { height: 26px; border-radius: 4px; overflow: hidden; display: flex;
               border: 1px solid var(--border); margin: 10px 0; }
        .bar span { display: flex; align-items: center; justify-content: center;
                    font-size: .8rem; color: #fff; white-space: nowrap; }
        .home-fill { background: var(--accent); }
        .away-fill { background: #9ca3af; }
        .muted { color: var(--muted); font-size: .85rem; }
        .warn { border-left: 3px solid #d97706; padding-left: 12px; }
        .seasons { display: flex; flex-wrap: wrap; gap: 6px; }
        .seasons a { padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px; }
        .seasons a.current { background: var(--accent); color: #fff; border-color: var(--accent); }
        code { font-family: ui-monospace, Consolas, monospace; font-size: .85rem; }
    </style>
</head>
<body>
<div class="wrap">
    <nav><a href="/">Predict &amp; teams</a><a href="/log">Prediction log</a></nav>
    {% block content %}{% endblock %}
</div>
{% block scripts %}{% endblock %}
</body>
</html>
